<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ร้าน มิ - Soft Minimal Pastel V.17</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mitr:wght@300;400;500&family=Slackey&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-pastel: #FFF5F7;
            --card-bg: rgba(255, 255, 255, 0.85);
            --pink-soft: #FFB7C5;
            --pink-main: #FF85A1;
            --brown-soft: #6C5B55;
            --cream-bg: #FFFBF9;
        }
        body {
            font-family: 'Mitr', sans-serif;
            background-color: var(--bg-pastel);
            background-image: radial-gradient(#FFE3EA 20%, transparent 20%);
            background-size: 20px 20px;
            color: var(--brown-soft);
            scroll-behavior: smooth;
        }
        .font-slackey {
            font-family: 'Slackey', cursive;
        }
        .minimal-card {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px rgba(255, 183, 197, 0.12);
        }
        .aspect-16-9 {
            aspect-ratio: 16 / 9;
        }
        .slider-track {
            display: flex;
            transition: transform 0.5s ease-in-out;
        }
        /* Custom File Input */
        input[type="file"]::file-selector-button {
            background-color: #FFEAEF;
            color: #FF85A1;
            border: none;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-family: 'Mitr', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        input[type="file"]::file-selector-button:hover {
            background-color: #FF85A1;
            color: white;
        }
    </style>
</head>
<body class="min-h-screen pb-16">

    <!-- 🎀 Minimal Welcome Modal -->
    <div id="welcome-modal" class="fixed inset-0 bg-pink-900/10 backdrop-blur-md z-50 flex items-center justify-center p-4">
        <div class="minimal-card rounded-[32px] p-8 max-w-sm w-full text-center relative border border-white">
            <div class="w-16 h-16 bg-[#FFEAEF] text-[#FF85A1] rounded-full flex items-center justify-center mx-auto mb-4 text-2xl shadow-inner">
                🌸
            </div>
            <h2 class="font-slackey text-2xl text-[#FF85A1] mb-2 tracking-wide">ร้าน มิ</h2>
            <p class="text-sm font-light text-[#6C5B55] mb-6">ยินดีต้อนรับเข้าสู่ร้าน มิ นะคะ ✨</p>
            <button onclick="enterSite()" class="w-full bg-[#FF85A1] hover:bg-[#FFB7C5] text-white text-sm font-medium py-3 rounded-full transition-all duration-300 shadow-md hover:shadow-lg active:scale-95">
                เข้าสู่ร้านค้า 💕
            </button>
        </div>
    </div>

    <!-- Audio Element -->
    <audio id="bg-music" loop>
        <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3?filename=lofi-study-112191.mp3" type="audio/mpeg">
    </audio>

    <!-- 🎵 Floating BGM Controller -->
    <div class="fixed bottom-5 right-5 z-40">
        <button id="music-btn" onclick="toggleMusic()" class="w-11 h-11 rounded-full bg-white/90 text-[#FF85A1] flex items-center justify-center shadow-lg border border-pink-100 hover:scale-105 transition">
            <span id="music-icon">🎵</span>
        </button>
    </div>

    <!-- ☁️ Clean Top Bar -->
    <header class="sticky top-0 z-30 bg-white/70 backdrop-blur-md border-b border-pink-100/60 px-6 py-3 flex justify-between items-center">
        <span id="nav-brand" class="font-slackey text-base text-[#FF85A1]">ร้าน มิ</span>
        <button onclick="toggleAdminModal()" class="text-xs bg-[#FFEAEF] hover:bg-[#FF85A1] hover:text-white text-[#FF85A1] px-4 py-1.5 rounded-full transition">
            ⚙️ แอดมิน
        </button>
    </header>

    <!-- 🌸 Main Minimal Container (16:9 Frame Design) -->
    <main class="max-w-3xl mx-auto mt-6 px-4">
        <div class="minimal-card rounded-[36px] p-6 sm:p-10 border border-white">
            
            <!-- Profile Section -->
            <div class="text-center mb-8 flex flex-col items-center">
                <div class="relative w-20 h-20 sm:w-24 sm:h-24 mb-3">
                    <img id="shop-logo" src="https://i.pinimg.com/736x/89/90/48/899048ab0cc455154006fdb9676964b3.jpg" class="w-full h-full object-cover rounded-full border-2 border-white shadow-md">
                </div>
                <h1 id="shop-name" class="font-slackey text-2xl sm:text-3xl text-[#FF85A1] mb-1">ร้าน มิ</h1>
                <p id="shop-welcome-text" class="text-xs sm:text-sm font-light text-[#6C5B55] bg-[#FFF5F7] px-4 py-1 rounded-full border border-pink-100 inline-block">
                    ยินดีต้อนรับเข้าสู่ร้าน มิ นะคะ ✨
                </p>
            </div>

            <!-- 16:9 Minimal Slider Banner -->
            <div class="mb-10 relative rounded-2xl overflow-hidden shadow-sm aspect-16-9 bg-[#FFEAEF] group">
                <div class="slider-track h-full" id="slider-track">
                    <div class="min-w-full h-full">
                        <img id="banner-img-1" src="https://images.unsplash.com/photo-1513201099705-a9746e1e201f?auto=format&fit=crop&w=1200&q=80" class="w-full h-full object-cover">
                    </div>
                    <div class="min-w-full h-full">
                        <img id="banner-img-2" src="https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1200&q=80" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <!-- 🛍️ Product Grid Section -->
            <div class="mb-10">
                <h3 class="font-slackey text-lg text-[#FF85A1] mb-5 flex items-center gap-2">
                    <span>🛍️</span> รายการสินค้า
                </h3>
                <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-3 gap-4 sm:gap-6">
                    <!-- Dynamic Products -->
                </div>
            </div>

            <!-- ☁️ About Section -->
            <div class="bg-[#FFF9FA] p-6 rounded-2xl border border-pink-100/60 text-center mb-8">
                <h4 class="font-slackey text-sm text-[#FF85A1] mb-2">เกี่ยวกับร้าน 🌸</h4>
                <p id="shop-about-text" class="text-xs sm:text-sm font-light text-[#6C5B55] leading-relaxed">
                    รวมสินค้าน่ารัก สไตล์พาสเทลมินิมอล ราคาน่ารักเป็นกันเอง สอบถามได้ตลอดเลยนะคะ 💕
                </p>
            </div>

            <footer class="text-center text-[11px] text-pink-300 font-slackey">
                THANK YOU FOR VISITING MEE SHOP 💕
            </footer>

        </div>
    </main>

    <!-- ⚙️ Soft Admin Modal -->
    <div id="admin-modal" class="fixed inset-0 bg-pink-900/10 backdrop-blur-sm hidden items-center justify-center z-50 p-4">
        <div class="bg-white rounded-[32px] p-6 w-full max-w-md border border-pink-100 shadow-xl relative max-h-[85vh] overflow-y-auto">
            <button onclick="toggleAdminModal()" class="absolute top-4 right-4 text-pink-300 hover:text-pink-500 text-sm">✕</button>
            
            <h3 class="font-slackey text-xl text-center text-[#FF85A1] mb-5">จัดการระบบ ร้าน มิ</h3>
            
            <div class="flex gap-2 mb-5">
                <button onclick="switchAdminTab('shop')" id="tab-btn-shop" class="flex-1 py-1.5 text-xs font-medium rounded-full bg-[#FF85A1] text-white">ร้านค้า</button>
                <button onclick="switchAdminTab('products')" id="tab-btn-products" class="flex-1 py-1.5 text-xs font-medium rounded-full bg-pink-50 text-[#6C5B55]">สินค้า</button>
            </div>

            <!-- Shop Info Form -->
            <div id="tab-shop" class="space-y-3 text-xs">
                <div>
                    <label class="block text-[#6C5B55] mb-1 font-medium">ชื่อร้าน</label>
                    <input type="text" id="input-shop-name" class="w-full p-2.5 rounded-xl border border-pink-100 bg-pink-50/30 focus:outline-none focus:border-[#FF85A1]">
                </div>
                <div>
                    <label class="block text-[#6C5B55] mb-1 font-medium">ข้อความต้อนรับ</label>
                    <input type="text" id="input-welcome-text" class="w-full p-2.5 rounded-xl border border-pink-100 bg-pink-50/30 focus:outline-none focus:border-[#FF85A1]">
                </div>
                <div>
                    <label class="block text-[#6C5B55] mb-1 font-medium">เกี่ยวกับร้าน</label>
                    <textarea id="input-about-text" rows="2" class="w-full p-2.5 rounded-xl border border-pink-100 bg-pink-50/30 focus:outline-none focus:border-[#FF85A1]"></textarea>
                </div>
                <div>
                    <label class="block text-[#6C5B55] mb-1 font-medium">โลโก้ร้าน (เลือกไฟล์จากเครื่อง)</label>
                    <input type="file" id="file-logo" accept="image/*" class="w-full text-xs text-gray-500">
                </div>
                <div>
                    <label class="block text-[#6C5B55] mb-1 font-medium">แบนเนอร์ 1 (เลือกไฟล์จากเครื่อง)</label>
                    <input type="file" id="file-banner-1" accept="image/*" class="w-full text-xs text-gray-500">
                </div>
                <div>
                    <label class="block text-[#6C5B55] mb-1 font-medium">แบนเนอร์ 2 (เลือกไฟล์จากเครื่อง)</label>
                    <input type="file" id="file-banner-2" accept="image/*" class="w-full text-xs text-gray-500">
                </div>
                <div>
                    <label class="block text-[#6C5B55] mb-1 font-medium">เพลงประกอบ (ไฟล์ MP3)</label>
                    <input type="file" id="file-music" accept="audio/*" class="w-full text-xs text-gray-500">
                </div>
                <button onclick="saveShopInfo()" class="w-full bg-[#FF85A1] text-white py-2.5 rounded-full font-medium hover:bg-[#FFB7C5] transition shadow-sm mt-3">บันทึกข้อมูล</button>
            </div>

            <!-- Product Manager -->
            <div id="tab-products" class="hidden space-y-4 text-xs">
                <div class="bg-pink-50/40 p-3.5 rounded-2xl border border-pink-100">
                    <h4 class="font-medium text-[#FF85A1] mb-2">➕ เพิ่มสินค้าใหม่</h4>
                    <div class="space-y-2">
                        <input type="text" id="new-prod-title" placeholder="ชื่อสินค้า" class="w-full p-2 rounded-lg border border-pink-100">
                        <input type="number" id="new-prod-price" placeholder="ราคา (บาท)" class="w-full p-2 rounded-lg border border-pink-100">
                        <input type="file" id="new-prod-file" accept="image/*" class="w-full text-xs text-gray-500">
                        <button onclick="addProduct()" class="w-full bg-[#FF85A1] text-white py-2 rounded-lg font-medium hover:bg-[#FFB7C5] transition">เพิ่มสินค้า</button>
                    </div>
                </div>

                <div id="admin-product-list" class="space-y-2 max-h-48 overflow-y-auto">
                    <!-- Dynamic Product List -->
                </div>
            </div>

        </div>
    </div>

    <script>
        const defaultShopData = {
            name: "ร้าน มิ",
            welcomeText: "ยินดีต้อนรับเข้าสู่ร้าน มิ นะคะ ✨",
            aboutText: "รวมสินค้าน่ารัก สไตล์พาสเทลมินิมอล ราคาน่ารักเป็นกันเอง สอบถามได้ตลอดเลยนะคะ 💕",
            logo: "https://i.pinimg.com/736x/89/90/48/899048ab0cc455154006fdb9676964b3.jpg",
            banner1: "https://images.unsplash.com/photo-1513201099705-a9746e1e201f?auto=format&fit=crop&w=1200&q=80",
            banner2: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1200&q=80",
            products: [
                { id: 1, title: "กระเป๋าพาสเทลมินิมอล", price: 159, img: "https://images.unsplash.com/photo-1584917865442-de89df76afd3?auto=format&fit=crop&w=600&q=80" },
                { id: 2, title: "สมุดโน้ตละมุน MEE", price: 59, img: "https://images.unsplash.com/photo-1544816155-12df9643f363?auto=format&fit=crop&w=600&q=80" },
                { id: 3, title: "สติกเกอร์ตกแต่งพาสเทล", price: 29, img: "https://images.unsplash.com/photo-1572375992501-4b0892d50c69?auto=format&fit=crop&w=600&q=80" }
            ]
        };

        let shopData = JSON.parse(localStorage.getItem('mee_shop_data')) || defaultShopData;

        function saveData() {
            localStorage.setItem('mee_shop_data', JSON.stringify(shopData));
            renderShop();
        }

        function renderShop() {
            document.getElementById('shop-name').innerText = shopData.name;
            document.getElementById('nav-brand').innerText = shopData.name;
            document.getElementById('shop-welcome-text').innerText = shopData.welcomeText;
            document.getElementById('shop-about-text').innerText = shopData.aboutText;
            document.getElementById('shop-logo').src = shopData.logo;
            document.getElementById('banner-img-1').src = shopData.banner1;
            document.getElementById('banner-img-2').src = shopData.banner2;

            const grid = document.getElementById('product-grid');
            const adminList = document.getElementById('admin-product-list');
            grid.innerHTML = '';
            adminList.innerHTML = '';

            shopData.products.forEach(p => {
                grid.innerHTML += `
                    <div class="bg-white/80 rounded-2xl p-3 border border-pink-100/60 shadow-sm flex flex-col hover:shadow-md transition">
                        <div class="aspect-square rounded-xl overflow-hidden mb-2.5 bg-pink-50">
                            <img src="${p.img}" class="w-full h-full object-cover">
                        </div>
                        <h4 class="font-normal text-[#6C5B55] text-xs mb-1 truncate">${p.title}</h4>
                        <p class="text-[#FF85A1] font-semibold text-sm mb-2">฿${p.price}</p>
                        <button onclick="alert('สั่งซื้อสินค้า: ${p.title}')" class="mt-auto w-full bg-[#FFF5F7] hover:bg-[#FF85A1] text-[#FF85A1] hover:text-white py-1.5 rounded-lg transition text-xs font-light">
                            สั่งซื้อ
                        </button>
                    </div>
                `;

                adminList.innerHTML += `
                    <div class="flex items-center justify-between gap-2 bg-pink-50/30 p-2 rounded-xl border border-pink-100">
                        <img src="${p.img}" class="w-8 h-8 object-cover rounded-md">
                        <div class="flex-1 min-w-0">
                            <p class="text-[11px] text-[#6C5B55] truncate">${p.title}</p>
                            <p class="text-[10px] text-[#FF85A1]">฿${p.price}</p>
                        </div>
                        <button onclick="deleteProduct(${p.id})" class="text-red-300 hover:text-red-500 text-xs px-1">ลบ</button>
                    </div>
                `;
            });
        }

        function enterSite() {
            document.getElementById('welcome-modal').classList.add('hidden');
            const audio = document.getElementById('bg-music');
            audio.play().catch(() => {});
        }

        function toggleMusic() {
            const audio = document.getElementById('bg-music');
            if (audio.paused) {
                audio.play();
                document.getElementById('music-icon').innerText = '🎵';
            } else {
                audio.pause();
                document.getElementById('music-icon').innerText = '🔇';
            }
        }

        function toggleAdminModal() {
            const modal = document.getElementById('admin-modal');
            modal.classList.toggle('hidden');
            if (!modal.classList.contains('hidden')) {
                document.getElementById('input-shop-name').value = shopData.name;
                document.getElementById('input-welcome-text').value = shopData.welcomeText;
                document.getElementById('input-about-text').value = shopData.aboutText;
            }
        }

        function switchAdminTab(tab) {
            if (tab === 'shop') {
                document.getElementById('tab-shop').classList.remove('hidden');
                document.getElementById('tab-products').classList.add('hidden');
                document.getElementById('tab-btn-shop').className = "flex-1 py-1.5 text-xs font-medium rounded-full bg-[#FF85A1] text-white";
                document.getElementById('tab-btn-products').className = "flex-1 py-1.5 text-xs font-medium rounded-full bg-pink-50 text-[#6C5B55]";
            } else {
                document.getElementById('tab-shop').classList.add('hidden');
                document.getElementById('tab-products').classList.remove('hidden');
                document.getElementById('tab-btn-shop').className = "flex-1 py-1.5 text-xs font-medium rounded-full bg-pink-50 text-[#6C5B55]";
                document.getElementById('tab-btn-products').className = "flex-1 py-1.5 text-xs font-medium rounded-full bg-[#FF85A1] text-white";
            }
        }

        function readFileAsDataURL(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = e => resolve(e.target.result);
                reader.onerror = e => reject(e);
                reader.readAsDataURL(file);
            });
        }

        async function saveShopInfo() {
            shopData.name = document.getElementById('input-shop-name').value;
            shopData.welcomeText = document.getElementById('input-welcome-text').value;
            shopData.aboutText = document.getElementById('input-about-text').value;

            const logo = document.getElementById('file-logo').files[0];
            if (logo) shopData.logo = await readFileAsDataURL(logo);

            const b1 = document.getElementById('file-banner-1').files[0];
            if (b1) shopData.banner1 = await readFileAsDataURL(b1);

            const b2 = document.getElementById('file-banner-2').files[0];
            if (b2) shopData.banner2 = await readFileAsDataURL(b2);

            const music = document.getElementById('file-music').files[0];
            if (music) {
                document.getElementById('bg-music').src = await readFileAsDataURL(music);
                document.getElementById('bg-music').play();
            }

            saveData();
            toggleAdminModal();
            alert("บันทึกข้อมูลเรียบร้อยแล้วค่ะ ✨");
        }

        async function addProduct() {
            const title = document.getElementById('new-prod-title').value;
            const price = document.getElementById('new-prod-price').value;
            const file = document.getElementById('new-prod-file').files[0];

            if (!title || !price || !file) {
                alert("กรุณากรอกข้อมูลและเลือกรูปภาพสินค้าให้ครบถ้วนค่ะ");
                return;
            }

            shopData.products.push({
                id: Date.now(),
                title: title,
                price: Number(price),
                img: await readFileAsDataURL(file)
            });

            saveData();
            document.getElementById('new-prod-title').value = '';
            document.getElementById('new-prod-price').value = '';
            document.getElementById('new-prod-file').value = '';
            alert("เพิ่มสินค้าเรียบร้อยค่ะ!");
        }

        function deleteProduct(id) {
            if (confirm("ลบสินค้านี้ใช่ไหมคะ?")) {
                shopData.products = shopData.products.filter(p => p.id !== id);
                saveData();
            }
        }

        // Auto Slider
        let slideIndex = 0;
        setInterval(() => {
            slideIndex = (slideIndex + 1) % 2;
            document.getElementById('slider-track').style.transform = `translateX(-${slideIndex * 100}%)`;
        }, 4000);

        renderShop();
    </script>
</body>
</html>
